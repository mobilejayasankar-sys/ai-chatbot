<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — Mood Journal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #06b6d4 0%, #8b5cf6 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      padding: 40px 36px;
      width: 90%;
      max-width: 380px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .logo { font-size: 48px; }
    h1 { font-size: 22px; color: #1e1b4b; }
    p  { font-size: 14px; color: #888; line-height: 1.6; }
    .google-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 20px;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      background: white;
      font-size: 15px;
      font-weight: bold;
      color: #1e1b4b;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s;
    }
    .google-btn:hover { background: #f9fafb; }
    .google-icon {
      width: 20px; height: 20px;
    }
    .footer { font-size: 11px; color: #bbb; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">📔</div>
    <h1>Welcome to Mood Journal</h1>
    <p>Your safe space to reflect, journal, and connect with your emotions. Sign in to start your journey.</p>

    <a href="/auth/google" class="google-btn">
      <svg class="google-icon" viewBox="0 0 48 48">
        <path fill="#EA4335" d="M24 9.5c3.1 0 5.8 1.1 8 2.9l6-6C34.5 3.1 29.6 1 24 1 14.8 1 7 6.7 3.7 14.6l7 5.4C12.4 13.6 17.7 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.8 7.2l7.4 5.7c4.3-4 6.8-9.9 6.8-16.9z"/>
        <path fill="#FBBC05" d="M10.7 28.6A14.8 14.8 0 0 1 9.5 24c0-1.6.3-3.2.8-4.6l-7-5.4A23.9 23.9 0 0 0 0 24c0 3.9.9 7.5 2.5 10.8l8.2-6.2z"/>
        <path fill="#34A853" d="M24 47c5.9 0 10.9-2 14.5-5.3l-7.4-5.7c-2 1.4-4.6 2.2-7.1 2.2-6.3 0-11.6-4.2-13.5-9.9l-8.2 6.2C7.1 41.5 14.9 47 24 47z"/>
      </svg>
      Sign in with Google
    </a>

    <div class="footer">Your data is private and tied to your Google account only.</div>
  </div>
</body>
</html>
