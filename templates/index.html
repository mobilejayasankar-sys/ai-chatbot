<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mood Journal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: Arial, sans-serif;
      background: #f0f2f5;
    }

    #app {
      display: flex;
      width: 100%;
      height: 100vh;
      background: white;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    #sidebar {
      width: 220px;
      background: #1e1b4b;
      display: flex;
      flex-direction: column;
      padding: 16px 12px;
      gap: 8px;
      flex-shrink: 0;
      transition: transform 0.25s ease;
      z-index: 100;
    }

    #sidebar h3 {
      color: #a5b4fc;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    #session-list {
      overflow-y: auto;
      flex: 1;
    }

    .session-btn {
      background: transparent;
      color: #c7d2fe;
      border: none;
      border-radius: 8px;
      padding: 8px 10px;
      text-align: left;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      width: 100%;
    }

    .session-btn:hover { background: rgba(255,255,255,0.1); }

    .session-btn.active {
      background: #4f46e5;
      color: white;
      font-weight: bold;
    }

    .session-btn .del {
      font-size: 14px;
      color: #f87171;
      visibility: hidden;
      flex-shrink: 0;
    }

    .session-btn:hover .del { visibility: visible; }

    #new-session-area {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-top: 8px;
    }

    #new-session-input {
      padding: 7px 10px;
      border-radius: 8px;
      border: 1px solid #4f46e5;
      background: #2e2a6e;
      color: white;
      font-size: 13px;
      outline: none;
    }

    #new-session-input::placeholder { color: #818cf8; }

    #new-session-btn {
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 7px;
      font-size: 13px;
      cursor: pointer;
    }

    #new-session-btn:hover { background: #3730a3; }

    /* Mobile sidebar overlay backdrop */
    #sidebar-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 99;
    }

    /* ── Chat area ── */
    #chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }

    /* ── Header ── */
    #header {
      background: linear-gradient(135deg, #06b6d4 0%, #8b5cf6 100%);
      color: white;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex-shrink: 0;
    }

    #menu-btn {
      display: none;
      background: none;
      border: none;
      color: white;
      font-size: 22px;
      cursor: pointer;
      padding: 0 4px;
      flex-shrink: 0;
      line-height: 1;
    }

    #session-title {
      font-size: 14px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      min-width: 0;
    }

    #header-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    #settings-btn {
      background: rgba(255,255,255,0.2);
      color: white;
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }

    #settings-btn:hover { background: rgba(255,255,255,0.35); }

    #user-avatar {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.5);
      flex-shrink: 0;
      object-fit: cover;
    }

    #user-email {
      font-size: 11px;
      color: rgba(255,255,255,0.85);
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #logout-btn {
      font-size: 11px;
      color: white;
      text-decoration: none;
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 6px;
      padding: 3px 8px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    #logout-btn:hover { background: rgba(255,255,255,0.2); }

    /* ── Messages ── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg-wrapper {
      display: flex;
      flex-direction: column;
      max-width: 80%;
    }

    .msg-wrapper.user { align-self: flex-end; }
    .msg-wrapper.bot  { align-self: flex-start; }

    .message {
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .user-msg {
      background: #4f46e5;
      color: white;
      border-radius: 12px 12px 2px 12px;
    }

    .bot-msg {
      background: #f1f0fe;
      color: #1e1b4b;
      border-radius: 12px 12px 12px 2px;
    }

    .bot-msg.mood-styled {
      background: transparent;
      border-left: 4px solid;
      padding-left: 12px;
      font-weight: 500;
      border-radius: 4px;
    }

    .typing {
      background: #f1f0fe;
      color: #888;
      border-radius: 12px;
      font-style: italic;
      padding: 10px 14px;
      font-size: 14px;
      align-self: flex-start;
    }

    .timestamp {
      font-size: 10px;
      color: #aaa;
      margin-top: 3px;
    }

    .msg-wrapper.user .timestamp { text-align: right; }
    .msg-wrapper.bot  .timestamp { text-align: left; }

    .divider {
      text-align: center;
      font-size: 11px;
      color: #aaa;
      margin: 4px 0;
    }

    #no-session {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #aaa;
      font-size: 14px;
      flex-direction: column;
      gap: 8px;
    }

    /* ── Input area ── */
    #input-area {
      display: flex;
      flex-direction: column;
      padding: 10px 16px 12px;
      border-top: 1px solid #e5e7eb;
      gap: 8px;
      flex-shrink: 0;
    }

    #image-preview-bar {
      display: none;
      align-items: center;
      gap: 8px;
      background: #f1f0fe;
      border-radius: 10px;
      padding: 6px 10px;
    }

    #image-preview-bar img {
      width: 44px;
      height: 44px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid #c4b5fd;
    }

    #image-preview-bar span {
      flex: 1;
      font-size: 12px;
      color: #4f46e5;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #remove-image-btn {
      background: none;
      border: none;
      color: #f87171;
      font-size: 16px;
      cursor: pointer;
      flex-shrink: 0;
      line-height: 1;
    }

    #input-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    #image-btn {
      background: none;
      border: 1px solid #d1d5db;
      border-radius: 50%;
      width: 42px;
      height: 42px;
      font-size: 18px;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #6b7280;
    }

    #image-btn:hover { background: #f3f4f6; border-color: #4f46e5; color: #4f46e5; }
    #image-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    #user-input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 24px;
      border: 1px solid #d1d5db;
      font-size: 14px;
      outline: none;
      min-width: 0;
    }

    #user-input:focus { border-color: #4f46e5; }
    #user-input:disabled { background: #f9fafb; }

    #send-btn {
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 50%;
      width: 42px;
      height: 42px;
      font-size: 18px;
      cursor: pointer;
      flex-shrink: 0;
    }

    #send-btn:hover { background: #3730a3; }
    #send-btn:disabled { background: #c4b5fd; cursor: not-allowed; }

    /* image message thumbnail */
    .img-thumb {
      max-width: 180px;
      max-height: 140px;
      border-radius: 8px;
      margin-bottom: 4px;
      display: block;
    }

    /* ── Settings popup ── */
    #settings-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.4);
      justify-content: center;
      align-items: center;
      z-index: 200;
      padding: 16px;
    }

    #settings-overlay.show { display: flex; }

    #settings-panel {
      background: white;
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    #settings-panel h2 { font-size: 16px; color: #1e1b4b; }
    #settings-panel p  { font-size: 13px; color: #888; }

    #personality-input {
      width: 100%;
      height: 100px;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      font-size: 13px;
      font-family: Arial, sans-serif;
      resize: none;
      outline: none;
    }

    #personality-input:focus { border-color: #4f46e5; }

    .panel-btns {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    .btn-cancel {
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      background: white;
      font-size: 13px;
      cursor: pointer;
    }

    .btn-save {
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      background: #4f46e5;
      color: white;
      font-size: 13px;
      cursor: pointer;
    }

    .btn-save:hover { background: #3730a3; }

    .preset-btns {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .preset {
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid #e0e7ff;
      background: #eef2ff;
      color: #4f46e5;
      font-size: 12px;
      cursor: pointer;
    }

    .preset:hover { background: #e0e7ff; }

    /* ── Mobile responsive ── */
    @media (max-width: 600px) {
      #app {
        flex-direction: column;
        height: 100dvh; /* dynamic viewport height — handles mobile browser bars */
      }

      #sidebar {
        position: fixed;
        top: 0;
        left: 0;
        height: 100%;
        width: 260px;
        transform: translateX(-100%);
        border-radius: 0;
      }

      #sidebar.open {
        transform: translateX(0);
      }

      #sidebar-backdrop.show {
        display: block;
      }

      #menu-btn {
        display: block;
      }

      #user-email {
        display: none;
      }

      #settings-btn {
        padding: 4px 8px;
        font-size: 11px;
      }

      .msg-wrapper {
        max-width: 90%;
      }
    }

    /* Tablet: sidebar narrower */
    @media (min-width: 601px) and (max-width: 900px) {
      #sidebar {
        width: 180px;
      }

      #user-email {
        display: none;
      }
    }
  </style>
</head>
<body>
<div id="app">

  <!-- Mobile sidebar backdrop -->
  <div id="sidebar-backdrop" onclick="closeSidebar()"></div>

  <!-- Sidebar -->
  <div id="sidebar">
    <h3>📔 Journal Entries</h3>
    <div id="session-list"></div>
    <div id="new-session-area">
      <input id="new-session-input" type="text" placeholder="Entry title (e.g., Today's Mood)..."
             onkeydown="if(event.key==='Enter') createSession()"/>
      <button id="new-session-btn" onclick="createSession()">+ New Entry</button>
    </div>
  </div>

  <!-- Chat area -->
  <div id="chat-area">

    <div id="header">
      <button id="menu-btn" onclick="toggleSidebar()" aria-label="Toggle menu">☰</button>
      <span id="session-title">📔 My Mood Journal</span>
      <div id="header-right">
        <button id="settings-btn" onclick="openSettings()">💭 Style</button>
        <img id="user-avatar" src="{{ user_picture }}"
             onerror="this.style.display='none'" alt="avatar"/>
        <span id="user-email">{{ user_email }}</span>
        <a id="logout-btn" href="/logout">Logout</a>
      </div>
    </div>

    <div id="messages">
      <div id="no-session">
        <span style="font-size: 32px;">📔</span>
        <span>Create a new journal entry to start reflecting</span>
      </div>
    </div>

    <div id="input-area">
      <!-- Image preview bar (shown when an image is selected) -->
      <div id="image-preview-bar">
        <img id="preview-thumb" src="" alt="preview"/>
        <span id="preview-name"></span>
        <button id="remove-image-btn" onclick="removeImage()" title="Remove image">✕</button>
      </div>
      <!-- Text + buttons row -->
      <div id="input-row">
        <input id="image-file" type="file" accept="image/*" style="display:none" onchange="imageSelected(event)"/>
        <button id="image-btn" disabled onclick="document.getElementById('image-file').click()" title="Share a mood photo">🖼</button>
        <input id="user-input" type="text" placeholder="Share what you're feeling..."
               disabled onkeydown="if(event.key==='Enter') sendMessage()"/>
        <button id="send-btn" disabled onclick="sendMessage()">➤</button>
      </div>
    </div>
  </div>

  <!-- Settings popup -->
  <div id="settings-overlay" onclick="overlayClick(event)">
    <div id="settings-panel">
      <h2>💭 Journal Style</h2>
      <p>Choose how your mood buddy should support you.</p>
      <div class="preset-btns">
        <button class="preset" onclick="setPreset('Supportive listener')">🫂 Supportive listener</button>
        <button class="preset" onclick="setPreset('Thoughtful guide')">🧭 Thoughtful guide</button>
        <button class="preset" onclick="setPreset('Empathetic friend')">💕 Empathetic friend</button>
        <button class="preset" onclick="setPreset('Reflective coach')">🎯 Reflective coach</button>
        <button class="preset" onclick="setPreset('Calm presence')">🧘 Calm presence</button>
      </div>
      <textarea id="personality-input" placeholder="e.g. You are a friendly Python tutor..."></textarea>
      <div class="panel-btns">
        <button class="btn-cancel" onclick="closeSettings()">Cancel</button>
        <button class="btn-save" onclick="savePersonality()">Save</button>
      </div>
    </div>
  </div>

</div>

<script>
  let activeSession = null;

  const presets = {
    "Supportive listener": "You are a compassionate mood journaling companion. Listen deeply and validate feelings. Ask gentle follow-up questions. Keep responses SHORT (2-3 sentences). Be warm and non-judgmental.",
    "Thoughtful guide": "You are a reflective journaling guide. Help users explore their emotions. Suggest gentle insights and coping strategies. Keep responses crisp and actionable. Focus on clarity and wisdom.",
    "Empathetic friend": "You are a caring emotional friend. Show genuine empathy for their feelings. Celebrate small wins and challenges. Use warm language. Keep advice simple and supportive.",
    "Reflective coach": "You are a mindful mood coaching companion. Help users understand patterns in their emotions. Ask powerful reflection questions. Keep responses brief and impactful.",
    "Calm presence": "You are a serene and grounding presence. Help users find peace and clarity. Use soothing language. Suggest breathing or grounding techniques. Keep guidance simple and calming."
  };

  window.onload = async function () {
    await loadSessions();
  };

  function toggleSidebar() {
    document.getElementById("sidebar").classList.toggle("open");
    document.getElementById("sidebar-backdrop").classList.toggle("show");
  }

  function closeSidebar() {
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("sidebar-backdrop").classList.remove("show");
  }

  async function loadSessions() {
    const res = await fetch("/sessions");
    const sessions = await res.json();
    renderSessions(sessions);
  }

  function renderSessions(sessions) {
    const list = document.getElementById("session-list");
    list.innerHTML = "";
    if (sessions.length === 0) {
      list.innerHTML = '<p style="color:#6366f1; font-size:12px; padding: 4px;">No sessions yet</p>';
      return;
    }
    sessions.forEach(name => {
      const btn = document.createElement("button");
      btn.className = "session-btn" + (name === activeSession ? " active" : "");
      btn.innerHTML = `<span>💬 ${name}</span><span class="del" onclick="deleteSession(event, '${name}')">✕</span>`;
      btn.onclick = () => { selectSession(name); closeSidebar(); };
      list.appendChild(btn);
    });
  }

  async function createSession() {
    const input = document.getElementById("new-session-input");
    const name = input.value.trim();
    if (!name) return;

    const res = await fetch("/sessions/create", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name })
    });
    const data = await res.json();
    if (data.error) { alert(data.error); return; }

    input.value = "";
    await loadSessions();
    selectSession(name);
    closeSidebar();
  }

  async function selectSession(name) {
    activeSession = name;
    document.getElementById("session-title").textContent = "📔 " + name;
    document.getElementById("user-input").disabled = false;
    document.getElementById("user-input").placeholder = "Share what you're feeling...";
    document.getElementById("send-btn").disabled = false;
    document.getElementById("image-btn").disabled = false;

    const res = await fetch(`/sessions/${name}/history`);
    const data = await res.json();

    const messages = document.getElementById("messages");
    messages.innerHTML = "";

    if (data.messages.length === 0) {
      addMessage("bot", `Hi! I'm here to listen and support you. What's on your mind? 💭`, null, null);
    } else {
      addDivider("📂 Journal entry loaded");
      data.messages.forEach(msg => addMessage(msg.role, msg.text, msg.time, msg.style || null));
    }

    await loadSessions();
  }

  async function deleteSession(e, name) {
    e.stopPropagation();
    if (!confirm(`Remove this journal entry "${name}"?`)) return;
    await fetch(`/sessions/${name}/delete`, { method: "POST" });
    if (activeSession === name) {
      activeSession = null;
      document.getElementById("session-title").textContent = "📔 My Mood Journal";
      document.getElementById("messages").innerHTML = `
        <div id="no-session">
          <span style="font-size:32px">📔</span>
          <span>Create a new journal entry to start reflecting</span>
        </div>`;
      document.getElementById("user-input").disabled = true;
      document.getElementById("user-input").placeholder = "Create a new entry first...";
      document.getElementById("send-btn").disabled = true;
      document.getElementById("image-btn").disabled = true;
      removeImage();
    }
    await loadSessions();
  }

  // ── Image upload helpers ──────────────────────────────
  let pendingImageFile = null;
  let pendingImageObjectURL = null;

  function imageSelected(e) {
    const file = e.target.files[0];
    if (!file) return;
    pendingImageFile = file;
    if (pendingImageObjectURL) URL.revokeObjectURL(pendingImageObjectURL);
    pendingImageObjectURL = URL.createObjectURL(file);

    document.getElementById("preview-thumb").src = pendingImageObjectURL;
    document.getElementById("preview-name").textContent = file.name;
    document.getElementById("image-preview-bar").style.display = "flex";
    document.getElementById("user-input").placeholder = "Add a caption or just press Send…";
    e.target.value = "";
  }

  function removeImage() {
    pendingImageFile = null;
    if (pendingImageObjectURL) { URL.revokeObjectURL(pendingImageObjectURL); pendingImageObjectURL = null; }
    document.getElementById("image-preview-bar").style.display = "none";
    document.getElementById("preview-thumb").src = "";
    document.getElementById("preview-name").textContent = "";
    if (activeSession) document.getElementById("user-input").placeholder = "Type your message...";
  }

  function addMessage(role, text, timeStr = null, style = null) {
    const messages = document.getElementById("messages");
    const noSession = document.getElementById("no-session");
    if (noSession) noSession.remove();

    const wrapper = document.createElement("div");
    wrapper.className = "msg-wrapper " + (role === "user" ? "user" : "bot");

    const div = document.createElement("div");
    div.className = "message " + (role === "user" ? "user-msg" : "bot-msg");

    // Apply mood-based styling for bot messages
    if (role === "bot" && style) {
      div.classList.add("mood-styled");
      div.style.color = style.color;
      div.style.fontSize = style.font_size;
      div.style.borderLeftColor = style.color;
    }

    div.textContent = text;

    const time = document.createElement("div");
    time.className = "timestamp";
    time.textContent = timeStr || getCurrentTime();

    wrapper.appendChild(div);
    wrapper.appendChild(time);
    messages.appendChild(wrapper);
    messages.scrollTop = messages.scrollHeight;
  }

  function addDivider(text) {
    const messages = document.getElementById("messages");
    const div = document.createElement("div");
    div.className = "divider";
    div.textContent = text;
    messages.appendChild(div);
  }

  function getCurrentTime() {
    const now = new Date();
    let hours = now.getHours();
    const mins = now.getMinutes().toString().padStart(2, "0");
    const ampm = hours >= 12 ? "PM" : "AM";
    hours = hours % 12 || 12;
    return `${hours}:${mins} ${ampm}`;
  }

  async function sendMessage() {
    if (!activeSession) return;
    const input = document.getElementById("user-input");
    const btn = document.getElementById("send-btn");
    const imgBtn = document.getElementById("image-btn");
    const text = input.value.trim();

    if (!pendingImageFile && !text) return;

    btn.disabled = true;
    imgBtn.disabled = true;
    input.value = "";

    const messages = document.getElementById("messages");
    const typing = document.createElement("div");
    typing.className = "typing";
    typing.id = "typing";
    typing.textContent = "Thinking...";

    if (pendingImageFile) {
      // Snapshot before removeImage() clears state
      const imageFile = pendingImageFile;
      const imageURL  = pendingImageObjectURL;

      addImageMessage(imageURL, text || null);
      removeImage();
      messages.appendChild(typing);
      messages.scrollTop = messages.scrollHeight;

      try {
        const form = new FormData();
        form.append("image", imageFile);
        if (text) form.append("caption", text);

        const res = await fetch(`/sessions/${activeSession}/describe-image`, {
          method: "POST",
          body: form
        });
        const data = await res.json();
        document.getElementById("typing").remove();
        if (data.error) { addMessage("bot", "⚠️ " + data.error); }
        else { addMessage("bot", data.reply, data.time); }
      } catch (err) {
        document.getElementById("typing").remove();
        addMessage("bot", "⚠️ Error uploading image.");
      }
    } else {
      addMessage("user", text);
      messages.appendChild(typing);
      messages.scrollTop = messages.scrollHeight;

      try {
        const res = await fetch(`/sessions/${activeSession}/chat`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text })
        });
        const data = await res.json();
        document.getElementById("typing").remove();
        addMessage("bot", data.reply, data.time, data.style || null);
      } catch (err) {
        document.getElementById("typing").remove();
        addMessage("bot", "⚠️ Error connecting to server.", null, null);
      }
    }

    btn.disabled = false;
    imgBtn.disabled = false;
  }

  function addImageMessage(objectURL, caption) {
    const messages = document.getElementById("messages");
    const noSession = document.getElementById("no-session");
    if (noSession) noSession.remove();

    const wrapper = document.createElement("div");
    wrapper.className = "msg-wrapper user";

    const img = document.createElement("img");
    img.src = objectURL;
    img.className = "img-thumb";

    wrapper.appendChild(img);

    if (caption) {
      const cap = document.createElement("div");
      cap.className = "message user-msg";
      cap.textContent = caption;
      wrapper.appendChild(cap);
    }

    const time = document.createElement("div");
    time.className = "timestamp";
    time.textContent = getCurrentTime();
    wrapper.appendChild(time);

    messages.appendChild(wrapper);
    messages.scrollTop = messages.scrollHeight;
  }

  function overlayClick(e) {
    if (e.target === document.getElementById("settings-overlay")) closeSettings();
  }

  function openSettings() {
    if (!activeSession) { alert("Please select a session first!"); return; }
    document.getElementById("settings-overlay").classList.add("show");
  }

  function closeSettings() {
    document.getElementById("settings-overlay").classList.remove("show");
  }

  function setPreset(name) {
    document.getElementById("personality-input").value = presets[name];
  }

  async function savePersonality() {
    const personality = document.getElementById("personality-input").value.trim();
    if (!personality) { alert("Personality cannot be empty!"); return; }

    await fetch(`/sessions/${activeSession}/personality`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ personality })
    });

    closeSettings();
    addDivider("💭 Journal style updated");
  }
</script>
</body>
</html>
